# Doutu v2 — clean refactor target (runs beside the legacy bundle for verification)
name: DoutuV2
options:
  bundleIdPrefix: com.luoyun
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "37"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DoutuV2:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets/home_top_loose.png
      - path: Assets/seg_q_loose.png
      - path: Assets/seg_dou_loose.png
      - path: Assets/seg_zhi_loose.png
      - path: Assets/seg_wei_loose.png
      - path: Assets/q_reference_loose.png
      - path: Assets/dou_reference_loose.png
      - path: Assets/zhi_reference_loose.png
      - path: Resources
        excludes:
          - "web"
      - path: Resources/web
        type: folder
      - path: Resources/AltIcons/AppIconAlipay@2x.png
      - path: Resources/AltIcons/AppIconAlipay@3x.png
      - path: Resources/AltIcons/AppIconAlipayHK@2x.png
      - path: Resources/AltIcons/AppIconAlipayHK@3x.png
      - path: Resources/AltIcons/AppIconWechat@2x.png
      - path: Resources/AltIcons/AppIconWechat@3x.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luoyun.doutu
        PRODUCT_NAME: Doutu
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconAlipay AppIconAlipayHK AppIconWechat"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks /usr/lib/swift"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: 豆图
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于连接开发机的调试服务
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要访问相册以便更换头像/二维码
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 需要写入相册以便保存去水印成品
        INFOPLIST_KEY_NSCameraUsageDescription: 需要相机以便扫一扫/拍摄头像
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 扫码只用画面，不录音
    dependencies: []
    postBuildScripts:
      - name: Add doutu URL scheme
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Viewer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string doutu" "$PLIST"

schemes:
  DoutuV2:
    build:
      targets:
        DoutuV2: all
    run:
      config: Debug
    archive:
      config: Release
