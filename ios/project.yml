# XcodeGen 工程定义（不提交 .xcodeproj，避免手工合并冲突）
#
# 用法（在 macOS 或 CI 上）：
#   brew install xcodegen
#   cd ios && xcodegen generate      # 生成 Doutu.xcodeproj
#   open Doutu.xcodeproj
#
# 为什么用 XcodeGen 而不是直接给 .xcodeproj：这台开发机没有 macOS，
# 手写 project.pbxproj 极易出错且无法验证；用一份可读的 yml 描述工程，
# 由工具在有 Mac 的环境里生成，是最稳的做法。
name: Doutu
options:
  bundleIdPrefix: com.luoyun
  deploymentTarget:
    # ⚠️ 降到 14.0：目标机型那台 iPhone 12 停在 **iOS 14.3**（停在 14.3 才能用 TrollStore
    # 永久签名安装，见 ios/INSTALL-IPA.md §0 方案 E）。
    # 于是两条硬约束：
    #   1. 不能直接用 iOS 15 才有的 API —— 尤其 `URLSession.data(for:)`，
    #      已在 Net/DtwTransport.swift 里换成 `withCheckedThrowingContinuation` 包 `dataTask`
    #   2. `async/await` 本身没问题：Swift 5.5+ 的并发运行时会由 Xcode 回带到 iOS 13+
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 与 Android 端对齐的版本（内部编码 = major*10000+minor*100+patch）
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10000"
    TARGETED_DEVICE_FAMILY: "1"          # 仅 iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Doutu:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 常规资源（Assets.xcassets 里是切图），但要把 web/ 排除掉，下面单独以文件夹引用加入，
      # 否则同一批文件会被加两次。
      - path: Resources
        excludes:
          - "web"
      # 小微主页那份 React 页面：**必须作为「文件夹引用」整体打包**，
      # 不能拆成一个个文件（它是 Vite 产物，靠相对路径 ./assets/xxx.js 加载）。
      - path: Resources/web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luoyun.doutu
        PRODUCT_NAME: Doutu
        # ⚠️ 必须打开：下面那一堆 `INFOPLIST_KEY_*` 只有在 Xcode **自动生成**
        # Info.plist 时才生效。没有它、又没有 Info.plist 文件，编译会直接报
        # "Info.plist not found"（这是第一次 CI 失败的原因之一）。
        GENERATE_INFOPLIST_FILE: YES
        # 图标资源集名称（Assets.xcassets/AppIcon.appiconset）。不写的话 XcodeGen
        # 生成的工程不带 ASSETCATALOG_COMPILER_APPICON_NAME，装到手机上就是白图标。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 「修改应用图标」那一格：支付宝 / 支付宝(香港) / 微信 三套备选图标。
        # 名称必须和 Assets.xcassets 里的 appiconset 一致；Xcode 会生成
        # CFBundleIcons.CFBundleAlternateIcons，再配合 setAlternateIconName 切换。
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconAlipay AppIconAlipayHK AppIconWechat"
        # 把备选 appiconset 一并编进 Assets.car（不加时某些 Xcode 只带主图标，
        # setAlternateIconName 会报找不到图标）。
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # SwiftUI 的 App 生命周期在 iOS 14+ 需要 Scene Manifest，否则真机启动可能黑屏。
        # 这一项让 Xcode **生成**（而不是有现成的）UIApplicationSceneManifest，
        # 与 Xcode 新建 SwiftUI 工程的默认值一致。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 排障期打开「文件」共享：真机闪退时能直接在 文件 App 里取 Documents/crash.log
        # （由 CrashLog.swift 写入）。正式发布前可以关掉。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # ⚠️ 必须声明 `@executable_path/Frameworks`：
        # iOS 15 以下系统不自带 `libswift_Concurrency.dylib`，Xcode 会把它塞进
        # App 的 Frameworks/ 目录；没有这条 rpath，dyld 找不到它就会**启动即闪退**。
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks /usr/lib/swift"
        # 把 Swift 标准库一起打进包（iOS 14 上少一层系统依赖，出包更稳）
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        # 竖屏；显示系统状态栏（Android 顶部时间/电量可见，iOS 不能隐藏）
        INFOPLIST_KEY_UIStatusBarHidden: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: 斗图去水印
        # 默认不出签名：CI 出未签名包给「万能签」重签；本机开发时自行覆盖
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        # 允许 http 明文只在调试期需要；正式环境服务端是 https
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        # 调试遥控要走局域网 http（http://192.168.1.96:8000），ATS 默认会拦明文请求；
        # 这一项只放开**本地网络**，不影响对外 https 的收紧。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        # 局域网访问在 iOS 14+ 会弹「本地网络」权限，这句说明为什么需要它
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于与电脑上的调试服务通信（仅调试期）
        # 头像上传要选相册
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要访问相册以便更换头像
        # 扫码页要实时预览（AVCaptureVideoPreviewLayer）+ 头像可以拍
        INFOPLIST_KEY_NSCameraUsageDescription: 需要相机以便扫码时实时预览画面、以及拍摄头像
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 扫码只用画面，不录音（系统可能因相机会话而询问）
    dependencies: []

# ⚠️ XcodeGen **不会**自动给 target 生成 scheme。没有这一段，
# CI 里的 `xcodebuild -scheme Doutu` 会报
# "The project named 'Doutu' does not contain a scheme named 'Doutu'"，
# 几十秒就失败（第一次 CI 失败正是这个）。
schemes:
  Doutu:
    build:
      targets:
        Doutu: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
