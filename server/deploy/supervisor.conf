; =============================================================================
; 短视频去水印平台 · Supervisor 进程守护配置
; -----------------------------------------------------------------------------
; 文件用途：
;   守护两个常驻 Node.js 进程：
;     doutu-api     —— 业务 API + 后台前端托管 + 成品下载（node src/index.js）
;     doutu-worker  —— 媒体处理常驻进程，消费任务队列并调用 ffmpeg（node src/worker.js）
;   定时任务（crontab）不在这里守护，见 deploy/crontab.txt。
;
; 部署位置（Ubuntu 22.04）：
;   /etc/supervisor/conf.d/doutu.conf
; 生效方式：
;   supervisorctl reread && supervisorctl update
;   supervisorctl status
;
; 宝塔面板：软件商店安装「Supervisor 管理器」后，
;   该文件既可被面板读取，也可直接用上面的 supervisorctl 命令管理；
;   面板里若显示进程重复，请二选一（面板管理 or 本文件管理），不要同时启用。
;
; 统一路径约定（与 crontab.txt / deploy.sh / docs/DEPLOY.md 完全一致）：
;   代码目录  /www/wwwroot/api.example.com        （内含 server/ 与 .env）
;   临时目录  /www/tmp                            （TMPDIR，需挂在大容量分区）
;   日志目录  /www/logs                           （应用日志与 Nginx 日志）
;   运行用户  www
; =============================================================================

[program:doutu-api]
; ---------------------------------------------------------------------------
; 业务进程：对外 API + /admin 后台 + /dw 下载
; 只在 127.0.0.1:7101 监听，公网流量一律由 Nginx 转发进来（见 deploy/nginx.conf）
; ---------------------------------------------------------------------------
directory=/www/wwwroot/api.example.com
command=/www/server/nodejs/v18/bin/node src/index.js
; ↑ 注意：路径里的 v18 只是宝塔默认安装目录名，本项目要求 Node.js >= 20
;   （依赖 node:sqlite、ESM 顶层 await、fetch 等 20+ 能力）。
; 宝塔面板 -> 软件商店 -> Node.js 版本管理器 安装 20 LTS 后，
;   请把 command 改成实际路径，例如：
;     /www/server/nodejs/v20.18.0/bin/node src/index.js
;   同时把下面 environment 里的 PATH 一起改掉，保持两者一致。
;   可用 `ls /www/server/nodejs/` 查看本机真实目录名。

autostart=true
; 开机自启；服务器重启后业务自动恢复，不依赖人工介入。

autorestart=true
; 进程退出（含崩溃、被 OOM Kill）后自动重启。

startsecs=5
; 启动后连续存活 5 秒才算 RUNNING；太短会把「启动即崩」误判为成功。

startretries=5
; 连续启动失败 5 次后置为 FATAL，避免无意义地疯狂重启刷日志。

stopwaitsecs=20
; 停止时给 20 秒做优雅退出（关闭 HTTP 监听、写完队列状态）。

stopasgroup=true
killasgroup=true
; 一起杀进程组：worker 会 fork ffmpeg 子进程，只杀父进程会留下僵尸 ffmpeg。

user=www
; 以低权限用户运行。代码目录属主也必须是 www（deploy.sh 已处理）。
; 绝不要用 root：ffmpeg/解析引擎一旦被利用，root 会直接丢掉整台机器。

environment=NODE_ENV="production",PATH="/www/server/nodejs/v18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",TZ="Asia/Shanghai",TMPDIR="/www/tmp",PORT="7101",BIND_HOST="127.0.0.1",LOG_DIR="/www/logs",LOG_LEVEL="info",FFMPEG_PATH="/usr/bin/ffmpeg",WATERMARK_FONT="/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc",MEDIA_PARSER_BASE="http://127.0.0.1:8051",DB_DIALECT="mysql",MYSQL_HOST="127.0.0.1",MYSQL_PORT="3306",REDIS_URL="",WORKER_CONCURRENCY="2",TASK_TIMEOUT_SEC="120",URL_TTL_SEC="900",SIGN_WINDOW_SEC="300",SESSION_TTL_HOURS="72",ADMIN_PATH="/admin",STORAGE_DRIVER="local",STORAGE_LOCAL_DIR="/www/wwwroot/api.example.com/storage",STORAGE_PUBLIC_BASE="https://api.example.com",PAY_PROVIDER="epay",EPAY_GATEWAY="https://pay.example.com",EPAY_NOTIFY_BASE="https://api.example.com",MASTER_KEY="REPLACE_WITH_32_BYTE_RANDOM_KEY",MYSQL_PASSWORD="REPLACE_WITH_DB_PASSWORD",EPAY_PID="REPLACE_WITH_EPAY_PID",EPAY_KEY="REPLACE_WITH_EPAY_KEY",ALERT_WEBHOOK=""
; environment 说明（逐项）：
;   NODE_ENV=production        关闭调试输出，启用生产错误处理
;   PATH                       必须包含 node 所在目录，否则 cron/supervisor 下找不到 node
;   TZ=Asia/Shanghai           统一时区，业务对账、收益日聚合都按北京时间切天
;   TMPDIR=/www/tmp            ffmpeg 中间文件落盘位置，必须是大容量分区（见 crontab 每小时清理）
;   PORT/BIND_HOST             与 nginx.conf 的 upstream doutu_api 严格对应
;   LOG_DIR=/www/logs          与 /www/logs/nginx 同父目录，便于统一采集
;   WATERMARK_FONT             Linux 用 fonts-wqy-zenhei 的中文字体，缺失会导致水印显示方块
;   MEDIA_PARSER_BASE          自研解析引擎 media-parser，内网 127.0.0.1:8051
;   REDIS_URL=""               留空即内存模式；生产建议填 redis://127.0.0.1:6379/0
;   MASTER_KEY / MYSQL_PASSWORD / EPAY_*  敏感值，正式环境改成真实值
;
; 安全提醒：
;   Supervisor 的 environment 是明文文件（默认 0644），敏感值只适合过渡使用。
;   强烈建议改为「值只写在 .env（chmod 600）里、应用自身加载」的方式：
;   应用启动时读取 /www/wwwroot/api.example.com/.env（见 deploy/README.md 第 6 节），
;   此时可把上面的 MASTER_KEY / MYSQL_PASSWORD / EPAY_KEY 从本文件删除。
;   任何情况下不要把 .env 放到 server/public 下。

stdout_logfile=/www/logs/doutu-api.out.log
stderr_logfile=/www/logs/doutu-api.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7
; 日志切割：单文件 50MB 轮转、保留 7 份（约 350MB/进程上限）。
; 这是 Supervisor 自带的按大小切割；若需要按天切割，请额外用 logrotate
; （配置片段见 deploy/README.md 的「日志与切割」小节，本目录不额外生成文件）。
; 应用自身还会写一份结构化日志到 /www/logs（LOG_DIR），由 crontab 的清理任务负责保留天数。

redirect_stderr=false
; 不把 stderr 合并进 stdout：进程崩溃栈与正常日志分开，排查 502 时更直接。

[program:doutu-worker]
; ---------------------------------------------------------------------------
; 媒体处理进程：从队列取任务 -> 调 ffmpeg 去水印/加水印 -> 产物落盘或上传 OSS
; 与 API 进程分离部署的目的：ffmpeg 是 CPU/IO 密集型，
; 放同一进程会拖慢 HTTP 响应，也无法独立扩容与重启。
; 该进程不监听任何端口，只消费队列（Redis 或内存模式下的同机队列）。
; ---------------------------------------------------------------------------
directory=/www/wwwroot/api.example.com
command=/www/server/nodejs/v18/bin/node src/worker.js
; ↑ 同样：Node 版本必须 >= 20，宝塔装 20 LTS 后改成 /www/server/nodejs/v20.18.0/bin/node

autostart=true
autorestart=true
startsecs=10
; worker 启动时要预热 ffmpeg 探测与队列连接，给它 10 秒判定存活。

startretries=5
stopwaitsecs=60
; 停止等待要长一些：正在跑的 ffmpeg 任务需要时间收尾，
; 直接 kill 会留下半成品文件与「处理中」的脏任务状态。
; 若确实要强杀，用 supervisorctl stop doutu-worker 之后手动确认 /www/tmp 残留。

stopasgroup=true
killasgroup=true

user=www

environment=NODE_ENV="production",PATH="/www/server/nodejs/v18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",TZ="Asia/Shanghai",TMPDIR="/www/tmp",LOG_DIR="/www/logs",LOG_LEVEL="info",FFMPEG_PATH="/usr/bin/ffmpeg",WATERMARK_FONT="/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc",MEDIA_PARSER_BASE="http://127.0.0.1:8051",DB_DIALECT="mysql",MYSQL_HOST="127.0.0.1",MYSQL_PORT="3306",REDIS_URL="",WORKER_CONCURRENCY="2",TASK_TIMEOUT_SEC="120",STORAGE_DRIVER="local",STORAGE_LOCAL_DIR="/www/wwwroot/api.example.com/storage",STORAGE_PUBLIC_BASE="https://api.example.com",MASTER_KEY="REPLACE_WITH_32_BYTE_RANDOM_KEY",MYSQL_PASSWORD="REPLACE_WITH_DB_PASSWORD",ALERT_WEBHOOK=""
; WORKER_CONCURRENCY=2 的依据：首期峰值并发 ≤50，媒体任务是重活，
;   一台 2~4 核机器上并发 2（每核 1 个 ffmpeg）即可；核数更多时按 核数/1.5 调大。
;   调太大只会让每个任务都变慢并拖垮 API 所在机器。

stdout_logfile=/www/logs/doutu-worker.out.log
stderr_logfile=/www/logs/doutu-worker.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

redirect_stderr=false

; =============================================================================
; 本地解析引擎 media-parser（Python，50 个平台）
; -----------------------------------------------------------------------------
; 代码在 /www/wwwroot/api.example.com/media-parser（与 server/ 同级）。
; 以 API_ONLY=true 起，纯解析、免鉴权、不记请求日志；只监听回环，不对外暴露。
; 装依赖：  cd media-parser && python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
; 服务端通过 .env 的 MEDIA_PARSER_BASE=http://127.0.0.1:8051 指过来（dw_route 表里那条「本地解析引擎」）。
; ⚠️ 解析是重活且要访问目标平台，必须放行出网；被墙/被限流时 watch 日志里的 retdesc。
; =============================================================================
[program:doutu-media-parser]
directory=/www/wwwroot/api.example.com/media-parser
command=/www/wwwroot/api.example.com/media-parser/.venv/bin/gunicorn -w 4 -k gthread --threads 8 -t 120 -b 127.0.0.1:8051 app:app

autostart=true
autorestart=true
startsecs=15
; 首次启动要建库、启动代理巡检线程，给足 15 秒。

startretries=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true

user=www

environment=API_ONLY="true",PYTHONUNBUFFERED="1",TZ="Asia/Shanghai",DATABASE_PATH="/www/wwwroot/api.example.com/media-parser/data/media_parser.db"
; API_ONLY=true 必须保留：否则 /api/v1/parse 会要求 API Key，服务端那条线路就调不通了。

stdout_logfile=/www/logs/doutu-media-parser.out.log
stderr_logfile=/www/logs/doutu-media-parser.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

redirect_stderr=false

; =============================================================================
; 常用运维命令
;   supervisorctl status                        # 查看三个进程状态
;   supervisorctl restart doutu-api             # 发版后重启业务进程
;   supervisorctl restart doutu-worker          # 改了 ffmpeg/并发相关配置后重启
;   supervisorctl restart doutu-media-parser    # 改了解析引擎配置/Cookie 后重启
;   supervisorctl tail -f doutu-media-parser stderr   # 看解析失败原因（retdesc 里有平台反馈）
;   supervisorctl tail -f doutu-api stderr      # 实时看错误输出
;   supervisorctl reread && supervisorctl update# 修改本文件后重新加载
; =============================================================================
