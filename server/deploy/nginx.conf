# =============================================================================
# 短视频去水印平台 · Nginx 站点配置（Ubuntu 22.04 + 宝塔面板）
# -----------------------------------------------------------------------------
# 文件用途：
#   本项目唯一对外入口。Nginx 负责 TLS 终止、路由分流、静态文件、限流与安全头。
#   Node.js 只监听回环地址，永不直接暴露公网。
#
# 部署方式（宝塔）：
#   1) 宝塔面板新建站点 api.example.com，纯静态即可（不要选 PHP 版本）。
#   2) 把本文件的「server 段」粘贴到 面板 -> 网站 -> 设置 -> 配置文件，
#      或写入 /www/server/panel/vhost/nginx/api.example.com.conf 后重载 Nginx。
#   3) http 层的限流区与 gzip 定义不可写在 server 段内，必须放到 http {} 中，
#      见文件末尾「附录 A / 附录 B」——宝塔做法是放进
#      /www/server/nginx/conf/nginx.conf 的 http {} 里，或用 include 引入。
#
# 重要：限流区（limit_req_zone / limit_conn_zone）只能定义在 http 上下文，
#       重复定义会导致 nginx -t 报 "duplicate zone"。若已由其他文件定义，
#       请删除本文件附录 A，避免冲突。
#
# 占位符（必须人工替换）：
#   api.example.com      -> 你的真实域名
#   /www/wwwroot/api.example.com -> 代码目录（与规划书一致，一般不改）
#   ssl_certificate      -> 证书路径（宝塔申请证书后自动生成）
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 上游定义：Node.js 业务进程（API + 后台 + 成品下载）
#    与 supervisor.conf 中的 doutu-api 完全对应：127.0.0.1:7101
#    使用 upstream 而不是直接写 IP，便于以后平滑扩到多实例（keepalive 复用连接）。
# -----------------------------------------------------------------------------
upstream doutu_api {
    server 127.0.0.1:7101 max_fails=3 fail_timeout=10s;
    keepalive 32;              # 复用后端长连接，降低 50 并发下的 TIME_WAIT 压力
    keepalive_timeout 60s;
}

server {
    # -------------------------------------------------------------------------
    # 2. 监听与域名
    #    - 80 端口只做 301 跳转到 https，不承载任何业务。
    #    - 443 启用 http2；TLS 只允许 1.2 / 1.3（1.0/1.1 已不安全且被主流端拒绝）。
    # -------------------------------------------------------------------------
    listen 80;
    listen 443 ssl http2;
    server_name api.example.com;

    # HTTP 强制跳转 HTTPS：避免升级包、支付回调走明文
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # 站点根目录：只暴露 public（版本包等静态资源）
    # 后台前端由 Node 进程自身托管在 /admin，不落在磁盘上，所以这里不需要 index。
    root /www/wwwroot/api.example.com/public;
    index index.html;

    # -------------------------------------------------------------------------
    # 3. TLS 证书与协议参数
    #    宝塔申请 Let's Encrypt / 商业证书后，将下面两行替换为实际路径。
    #    注意：宝塔「部署证书」会自动覆写这两行，届时以面板写入的为准。
    # -------------------------------------------------------------------------
    ssl_certificate     /www/server/panel/vhost/cert/api.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;      # TLS1.3 下交由客户端选择，性能更好
    ssl_session_cache shared:SSL:10m;   # 会话复用，减少移动端握手开销
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # 关闭 ticket，避免前向安全性被削弱
    ssl_stapling on;                    # OCSP 装订：客户端不必再单独查吊销状态
    ssl_stapling_verify on;
    resolver 223.5.5.5 119.29.29.29 valid=300s;   # 国内 DNS，用于解析 OCSP 地址
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # 4. HSTS 与安全响应头
    #    HSTS 先观察期用较小 max-age，确认全站 https 无误后再加到 31536000。
    #    includeSubDomains 仅在子域也全 https 时启用，否则会拖挂其他子站。
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 后台是独立前端，禁止被第三方站点 iframe 嵌套；若后台需要被内嵌管理页引用，去掉 SAMEORIGIN 改为放行特定域。
    # CSP 说明：API 响应本身不需要 CSP；后台页面若由 Node 托管，CSP 由 Node 端下发，避免此处覆盖。

    # -------------------------------------------------------------------------
    # 5. 请求体与超时
    #    - 100m：容纳水印图片素材、批量任务参数、后台导入文件。
    #    - 解析/合成是异步任务，接口本身很快，所以 API 超时保持 60s 即可；
    #      真正的长耗时走 /dw/ 下载（单独放宽，见第 10 节）。
    # -------------------------------------------------------------------------
    client_max_body_size 100m;
    client_body_buffer_size 256k;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    # 代理默认参数：后端只信任回环，因此必须把真实客户端信息透传过去，
    # 否则 Node 侧限流、风控、日志拿到的都是 127.0.0.1。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";     # 配合 upstream keepalive 复用长连接
    proxy_connect_timeout 5s;

    # -------------------------------------------------------------------------
    # 6. 访问日志
    #    日志目录需与 supervisor.conf / crontab.txt 中的 /www/logs 保持一致，
    #    便于统一采集与清理。宝塔默认按天切割已开启的站点日志。
    # -------------------------------------------------------------------------
    access_log /www/logs/nginx/api.example.com.access.log;
    error_log  /www/logs/nginx/api.example.com.error.log warn;

    # -------------------------------------------------------------------------
    # 7. 敏感路径拦截（正则 location 优先级高于任何前缀 location）
    #    必须在业务 location 之前命中，防止有人直接 GET /.env 拿到密钥。
    # -------------------------------------------------------------------------
    location ~* /(\.env(\..*)?|\.git|\.svn|\.hg|\.DS_Store|\.user\.ini)$ {
        deny all;
        access_log off;
        return 404;
    }
    # 兜底：任意以点开头的隐藏文件/目录一律拒绝（.well-known 例外，证书校验需要）
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        return 404;
    }
    # 备份 / 日志 / 压缩包 / SQL 导出 / 脚本源码，一律不可下载
    location ~* \.(sql|bak|old|log|zip|tar|tgz|gz|rar|7z|sh|py|md|json|lock|env|ini|conf|yml|yaml)$ {
        deny all;
        access_log off;
        return 404;
    }
    # Node 源码目录与应用内文件绝不通过 Nginx 暴露（只有 public 是白名单）
    # 由于 root 已指向 public，这里再显式拒绝一次，防止以后 root 被误改。
    location ~* ^/(src|node_modules|deploy|docs|\.env) {
        deny all;
        access_log off;
        return 404;
    }

    # -------------------------------------------------------------------------
    # 8. 业务 API：/api/v1/*
    #    普通接口 20r/s（突发 40），单 IP 并发连接 20。
    #    与「独立严限流」的激活接口分开，避免正常流量被激活接口的阈值拖累。
    # -------------------------------------------------------------------------
    location ^~ /api/v1/ {
        # ^~ 前缀优先级高于普通正则 location，因此在每个反代 location 内重复兜底一次，
        # 防止 /api/v1/.env、/api/v1/a.sql 这类请求绕过第 7 节的全局正则拦截。
        location ~* \.(env|sql|bak|old|log|zip|tar|tgz|gz|rar|7z|sh|py|md|ini|conf|yml|yaml|lock)$ {
            deny all;
            access_log off;
            return 404;
        }

        limit_req  zone=api_general burst=40 nodelay;
        limit_conn addr_conn 20;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://doutu_api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 接口响应默认不缓存；如以后有只读列表接口需要缓存，单独开 location 处理。
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # 9. 激活接口：/api/v1/auth/activate —— 必须独立严限流
    #    1r/s + burst 3：激活码接口是撞库/爆破的头号目标，
    #    即使被刷也只影响该接口自身，不会连带打挂其他 API。
    # -------------------------------------------------------------------------
    location = /api/v1/auth/activate {
        limit_req  zone=api_activate burst=3 nodelay;   # 1r/s，突发 3
        limit_conn addr_conn 5;                         # 激活接口再单独收紧连接数
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://doutu_api;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # 10. 成品下载：/dw/*
    #     下载由 Node 进程处理（校验 URL_TTL_SEC 时效签名后回源本地盘或 OSS 跳转），
    #     视频文件可达数百 MB，因此必须放宽读超时与缓冲，关掉代理缓冲以免占内存。
    # -------------------------------------------------------------------------
    location ^~ /dw/ {
        # 同样兜底拦截敏感后缀，避免下载路径被当成文件读取入口
        location ~* \.(env|sql|bak|old|log|zip|tar|tgz|gz|rar|7z|sh|py|md|ini|conf|yml|yaml|lock)$ {
            deny all;
            access_log off;
            return 404;
        }

        limit_req  zone=api_general burst=40 nodelay;
        limit_conn addr_conn 20;

        proxy_pass http://doutu_api;
        proxy_read_timeout 600s;        # 大文件传输需要长读超时，否则连接会在中途被 Nginx 断开
        proxy_send_timeout 600s;
        proxy_buffering off;            # 边下边传，避免 Nginx 先落盘/占内存
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;     # 关闭临时文件，防止大文件写满系统盘

        add_header Cache-Control "private, max-age=0" always;
    }

    # -------------------------------------------------------------------------
    # 11. 后台：/admin*
    #     后台前端由 Node 进程自身托管（ADMIN_PATH 默认 /admin），
    #     所以这里只做反代；后台包含上传与导出，超时略放宽。
    #     安全加固：建议在宝塔「网站 -> 配置文件」之外，用面板的 IP 白名单/基本认证
    #     再包一层；应用侧 ADMIN_PATH 可改成非常规路径降低被扫描概率。
    # -------------------------------------------------------------------------
    location ^~ /admin {
        # 后台路径下再次拦截敏感文件，防止有人用 /admin/.env 绕过第 7 节的正则规则
        # （^~ 前缀优先级高于普通正则 location，因此必须在此单独再 deny 一次）
        location ~* \.(env|sql|bak|old|log|zip|tar|gz|rar|7z|sh|py|ini|conf|yml|yaml|lock)$ {
            deny all;
            access_log off;
            return 404;
        }

        limit_req  zone=api_general burst=40 nodelay;
        limit_conn addr_conn 20;

        proxy_pass http://doutu_api;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # 12. 升级包静态目录：/upgrade/*
    #     版本包放在 public/upgrade/，由 Nginx 直接读盘发送，不经过 Node。
    #     关闭目录列表，防止他人枚举历史版本；带宽较大的包允许 Nginx sendfile。
    # -------------------------------------------------------------------------
    location ^~ /upgrade/ {
        alias /www/wwwroot/api.example.com/public/upgrade/;
        autoindex off;
        sendfile on;
        tcp_nopush on;

        # 只允许下载升级包与校验文件，其他后缀一律拒绝
        # 该目录内容完全由 deploy.sh / 发布流程控制，Nginx 只做后缀白名单。
        location ~* ^/upgrade/.*\.(apk|wgt|zip|txt|sha256)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # 反向匹配：任何「不在白名单内」的 /upgrade/ 请求直接 404（放在白名单规则之后）
        location ~* ^/upgrade/.*[^q]$ {
            return 404;
        }
    }

    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # 12b. 头像（公开只读）
    #      客户端用 BitmapFactory / 浏览器 <img> 直接取图，带不了签名头，
    #      所以服务端把它做成了免签名的公开路由：GET /avatar/{用户id}?v=版本号。
    #      这里必须显式反代，否则会落到下面 location / 的 404 上。
    # -------------------------------------------------------------------------
    location ^~ /avatar/ {
        limit_conn addr_conn 20;
        proxy_pass http://doutu_api;
        proxy_read_timeout 15s;
        # 头像是长期不变的图（换图会改 URL 上的 ?v=），可以放心让客户端/中间层缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 13. 健康检查与根路径
    #     /healthz 直连 Node（不占 /api/v1 限流额度，供宝塔/监控高频探测）。
    #     根路径返回 204，避免暴露任何默认页信息。
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://doutu_api;
        proxy_read_timeout 5s;
    }

    location = / {
        return 204;
    }

    # 未定义路径统一 404，不落到 Node 上，也不暴露框架指纹
    location / {
        return 404;
    }

    # -------------------------------------------------------------------------
    # 14. 错误页
    #     502/504 时给出简短 JSON，便于 App 端区分「后端挂了」与「业务错误」。
    #     注意：宝塔可能在 http 层已有 error_page，冲突时以那份为准。
    # -------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        default_type application/json;
        return 503 '{"code":503,"message":"service temporarily unavailable"}';
    }
}

# =============================================================================
# 附录 A：限流区定义（必须放在 http {} 上下文中，不能写在 server 内）
#   - api_general  ：普通 API/后台 20r/s，按 IP 维度
#   - api_activate ：激活接口 1r/s，按 IP 维度，独立 zone 避免互相影响
#   - addr_conn    ：单 IP 并发连接数 20
#   zone 大小 10m 大约可记录 16 万个 IP，首期 ≤500 用户、≤50 并发绰绰有余。
# =============================================================================
# limit_req_zone  $binary_remote_addr zone=api_general:10m  rate=20r/s;
# limit_req_zone  $binary_remote_addr zone=api_activate:10m rate=1r/s;
# limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
#
# 说明：上面三行用 # 注释掉是为了避免「同一 zone 被定义两次」导致 nginx -t 失败。
#       首次部署时取消注释（或复制到 http {} 中），确认全服务器仅定义一次。

# =============================================================================
# 附录 B：gzip 压缩（同样必须在 http {} 中；宝塔 http 层若已开启，请跳过）
#   视频与图片本身已压缩，只压文本类，避免 CPU 浪费。
# =============================================================================
# gzip on;
# gzip_vary on;
# gzip_comp_level 5;
# gzip_min_length 1024;
# gzip_proxied any;
# gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
# gzip_disable "msie6";
